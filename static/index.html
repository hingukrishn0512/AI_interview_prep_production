<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PrepCoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #212121;
    --bg-sidebar: #171717;
    --bg-surface: #2f2f2f;
    --bg-hover: #383838;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text-primary: #ececec;
    --text-secondary: #b4b4b4;
    --text-muted: #8e8e8e;
    --accent-btn: #ffffff;
    --accent-btn-text: #0d0d0d;
    --danger: #ef4444;
    --danger-subtle: rgba(239, 68, 68, 0.15);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  *::-webkit-scrollbar { display: none; }

  html, body {
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app-shell {
    display: flex;
    width: 100vw;
    height: 100dvh;
    background: var(--bg-main);
  }

  /* --- ChatGPT Sidebar --- */
  #sidebar {
    width: 260px;
    height: 100%;
    background-color: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    transition: transform 0.2s ease;
    z-index: 20;
  }

  .sidebar-header {
    padding: 14px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-primary);
    text-decoration: none;
  }

  .brand-icon {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: #ffffff;
    color: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
  }

  .btn-new-chat {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    margin: 4px 12px 14px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-new-chat:hover { background: var(--bg-hover); }

  .sidebar-section-title {
    padding: 0 16px 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .recents-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .recent-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s, color 0.15s;
  }
  .recent-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .recent-item.active {
    background: var(--bg-surface);
    color: var(--text-primary);
    font-weight: 600;
  }
  .recent-item-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .user-avatar-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e11d48;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .user-email-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-icon-ghost {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    font-family: inherit;
  }
  .btn-icon-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* --- Main Viewport --- */
  #main-viewport {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg-main);
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 52px;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .toggle-sidebar-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
  }
  .toggle-sidebar-btn:hover { background: var(--bg-surface); color: var(--text-primary); }
  .current-session-title {
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-actions-top {
    display: flex;
    gap: 8px;
  }
  .btn-action-small {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-action-small:hover { background: var(--bg-hover); color: var(--text-primary); }
  .btn-action-small.danger { color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

  /* Screens inside main viewport */
  .view-panel {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  /* --- Auth View (ChatGPT Style) --- */
  #view-auth {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .auth-card h2 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 4px;
  }
  .auth-tab-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 7px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }
  .auth-tab-btn.active {
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .auth-field label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .auth-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .auth-field input {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .auth-field input:focus { border-color: #ffffff; }
  .btn-auth-submit {
    background: var(--accent-btn);
    color: var(--accent-btn-text);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-auth-submit:hover { opacity: 0.92; }

  /* Fix Chrome autofill turning fields white */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text-primary) !important;
    -webkit-box-shadow: 0 0 0px 1000px #2f2f2f inset !important;
    transition: background-color 5000s ease-in-out 0s;
  }

  /* --- Setup View (Start Practice Session) --- */
  #view-setup {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  .setup-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .setup-head h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .setup-head p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

  .file-drop-box {
    position: relative;
    background: var(--bg-surface);
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .file-drop-box:hover { border-color: #ffffff; }
  .file-drop-box input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  /* --- Chat View --- */
  #view-chat {
    flex-direction: column;
    position: relative;
  }

  .chat-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18px 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .messages-thread {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .message-row {
    display: flex;
    gap: 14px;
    width: 100%;
  }
  .message-row.user {
    justify-content: flex-end;
  }

  .msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ffffff;
    color: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg-body {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .message-row.user .msg-body {
    max-width: 75%;
    align-items: flex-end;
  }

  .msg-bubble {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-primary);
  }

  .message-row.user .msg-bubble {
    background: var(--bg-surface);
    border-radius: 20px 20px 4px 20px;
    padding: 10px 18px;
    white-space: pre-wrap;
  }

  .message-row.ai .msg-bubble {
    padding: 4px 0;
  }

  .msg-tag {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble ul { margin: 4px 0 8px; padding-left: 20px; }
  .msg-bubble li { margin-bottom: 3px; }
  .msg-bubble strong { color: #ffffff; font-weight: 600; }
  .msg-bubble code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .msg-bubble pre {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 10px 0;
    overflow-x: auto;
  }
  .msg-bubble pre code {
    background: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.5;
  }

  .msg-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .msg-action-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .msg-action-btn:hover { color: var(--text-primary); }

  /* Floating ChatGPT Composer */
  .composer-fixed-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 18px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent 0%, var(--bg-main) 35%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .composer-capsule {
    width: 100%;
    max-width: 760px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 10px 14px 10px 18px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  }
  .composer-capsule:focus-within {
    border-color: var(--border-strong);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.45;
    resize: none;
    max-height: 120px;
    padding: 4px 0;
  }
  #user-input::placeholder { color: var(--text-muted); }

  #send-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ffffff;
    color: #0d0d0d;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 16px;
    font-weight: 700;
  }
  #send-btn:disabled {
    background: #424242;
    color: #8e8e8e;
    cursor: not-allowed;
  }

  .disclaimer-text {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: center;
  }

  /* Chips */
  .chips-row {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .prompt-chip {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .prompt-chip:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* Typing dots */
  .typing-wave { display: flex; gap: 4px; padding: 6px 0; }
  .typing-wave span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: wavePulse 1s infinite ease-in-out;
  }
  .typing-wave span:nth-child(2) { animation-delay: 0.15s; }
  .typing-wave span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes wavePulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .error-text {
    background: var(--danger-subtle);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--danger);
    font-size: 13px;
    border-radius: 8px;
    padding: 8px 12px;
    display: none;
  }

  @media (max-width: 768px) {
    #sidebar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Left ChatGPT Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <a href="#" class="brand-logo">
        <div class="brand-icon">AI</div>
        <span>PrepCoach</span>
      </a>
      <button class="btn-icon-ghost" id="sidebar-close-btn" title="Close sidebar">&times;</button>
    </div>

    <button class="btn-new-chat" id="btn-sidebar-new">
      <span>+</span>
      <span>New chat</span>
    </button>

    <div class="sidebar-section-title">Recents</div>
    <div class="recents-list" id="sidebar-recents"></div>

    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar-circle" id="user-avatar">U</div>
        <span class="user-email-text" id="user-email-label">Account</span>
      </div>
      <button class="btn-icon-ghost" id="logout-btn" title="Log out">Log out</button>
    </div>
  </aside>

  <!-- Main Viewport -->
  <main id="main-viewport">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="toggle-sidebar-btn" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
        <span class="current-session-title" id="top-title">PrepCoach</span>
      </div>
      <div class="session-actions-top" id="top-actions" style="display:none;">
        <button class="btn-action-small" id="top-delete-resume-btn" title="Delete stored resume">Delete resume</button>
        <button class="btn-action-small danger" id="top-delete-chat-btn" title="Delete this session">Delete chat</button>
      </div>
    </header>

    <!-- View 1: Auth (Login / Sign up) -->
    <section class="view-panel" id="view-auth">
      <div class="auth-card">
        <h2 id="auth-heading">Welcome back</h2>

        <div class="auth-tabs">
          <button type="button" class="auth-tab-btn active" id="tab-login">Log in</button>
          <button type="button" class="auth-tab-btn" id="tab-register">Sign up</button>
        </div>

        <div class="auth-field">
          <label for="auth-email">Email address</label>
          <div class="auth-input-wrapper">
            <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <label for="auth-password">Password</label>
          <div class="auth-input-wrapper">
            <input id="auth-password" type="password" placeholder="At least 8 characters" autocomplete="current-password">
          </div>
        </div>

        <button class="btn-auth-submit" id="auth-submit">Log in</button>
        <div class="error-text" id="auth-error"></div>
      </div>
    </section>

    <!-- View 2: Setup (New Interview Session) -->
    <section class="view-panel" id="view-setup">
      <div class="setup-container">
        <div class="setup-head">
          <h2>Start a practice session</h2>
          <p>Tell me who you’re preparing for and upload your resume. Every problem, behavioral prompt, and briefing will be calibrated to you.</p>
        </div>

        <div class="auth-field">
          <label for="company">Target Company</label>
          <div class="auth-input-wrapper">
            <input id="company" type="text" placeholder="e.g. Google, Amazon, Meta" autocomplete="off">
          </div>
        </div>

        <div class="auth-field">
          <label for="role">Target Role</label>
          <div class="auth-input-wrapper">
            <input id="role" type="text" placeholder="e.g. Software Engineer, Machine Learning Engineer" autocomplete="off">
          </div>
        </div>

        <div class="auth-field">
          <label for="resume">Resume (PDF)</label>
          <label class="file-drop-box" for="resume">
            <span id="resume-label" style="font-size:13px; color:var(--text-secondary);">Upload text-based PDF (max 5 MB)</span>
            <span class="btn-action-small">Browse</span>
            <input id="resume" type="file" accept="application/pdf,.pdf">
          </label>
        </div>

        <button class="btn-auth-submit" id="start-btn">Start session</button>
        <div class="error-text" id="setup-error"></div>
      </div>
    </section>

    <!-- View 3: Chat View -->
    <section class="view-panel" id="view-chat">
      <div class="chat-scroll-area" id="chat-scroller">
        <div class="messages-thread" id="messages-container"></div>
      </div>

      <div class="composer-fixed-bottom">
        <div class="chips-row" id="chips-container"></div>
        <div class="composer-capsule">
          <textarea id="user-input" rows="1" maxlength="2000" placeholder="Ask for a DSA problem, behavioral question, company research, or resume check..."></textarea>
          <button id="send-btn" title="Send message">&uarr;</button>
        </div>
        <div class="disclaimer-text">PrepCoach can make mistakes. Verify important information.</div>
      </div>
    </section>
  </main>
</div>

<script>
  // Pointed to your live Render backend for fast, lag-free Vercel CDN delivery
  const API_BASE = "https://ai-interview-prep-production-lrvm.onrender.com";
  const MAX_RESUME_BYTES = 5 * 1024 * 1024;
  const TOKEN_KEY = "coach_token";

  let token = null;
  let userEmail = null;
  let threadId = null;
  let busy = false;
  let lastUserText = null;
  let authMode = "login";
  let sessionsCache = [];

  class AuthError extends Error {}

  // UI Element Refs
  const sidebar = document.getElementById("sidebar");
  const sidebarToggleBtn = document.getElementById("sidebar-toggle");
  const sidebarCloseBtn = document.getElementById("sidebar-close-btn");
  const btnSidebarNew = document.getElementById("btn-sidebar-new");
  const sidebarRecents = document.getElementById("sidebar-recents");
  const userAvatar = document.getElementById("user-avatar");
  const userEmailLabel = document.getElementById("user-email-label");
  const logoutBtn = document.getElementById("logout-btn");

  const topTitle = document.getElementById("top-title");
  const topActions = document.getElementById("top-actions");
  const topDeleteResumeBtn = document.getElementById("top-delete-resume-btn");
  const topDeleteChatBtn = document.getElementById("top-delete-chat-btn");

  const viewAuth = document.getElementById("view-auth");
  const viewSetup = document.getElementById("view-setup");
  const viewChat = document.getElementById("view-chat");

  const authHeading = document.getElementById("auth-heading");
  const tabLogin = document.getElementById("tab-login");
  const tabRegister = document.getElementById("tab-register");
  const authEmail = document.getElementById("auth-email");
  const authPassword = document.getElementById("auth-password");
  const authSubmit = document.getElementById("auth-submit");
  const authError = document.getElementById("auth-error");

  const companyInput = document.getElementById("company");
  const roleInput = document.getElementById("role");
  const resumeInput = document.getElementById("resume");
  const resumeLabel = document.getElementById("resume-label");
  const startBtn = document.getElementById("start-btn");
  const setupError = document.getElementById("setup-error");

  const chatScroller = document.getElementById("chat-scroller");
  const messagesContainer = document.getElementById("messages-container");
  const chipsContainer = document.getElementById("chips-container");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  const SUGGESTIONS = [
    "Give me a DSA question",
    "Ask me a behavioral question",
    "Tell me about the company's interview process",
    "What should I brush up on in my resume?",
  ];

  const AGENT_LABELS = {
    dsa: "DSA Practice",
    behavioral: "Behavioral",
    company_research: "Company Intel",
    resume_gap: "Resume Check",
    general_chat: "Coach",
  };

  // Sidebar toggle
  sidebarToggleBtn.addEventListener("click", () => sidebar.classList.toggle("open"));
  sidebarCloseBtn.addEventListener("click", () => sidebar.classList.remove("open"));

  // Navigation
  btnSidebarNew.addEventListener("click", () => {
    sidebar.classList.remove("open");
    clearChatUI();
    showView("setup");
  });

  logoutBtn.addEventListener("click", logout);

  // Auth toggle
  tabLogin.addEventListener("click", () => setAuthMode("login"));
  tabRegister.addEventListener("click", () => setAuthMode("register"));
  authSubmit.addEventListener("click", submitAuth);
  authEmail.addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); });
  authPassword.addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); });

  // Setup form
  resumeInput.addEventListener("change", () => {
    const f = resumeInput.files[0];
    if (f) {
      const kb = Math.max(1, Math.round(f.size / 1024));
      resumeLabel.textContent = `${f.name} (${kb} KB)`;
      resumeLabel.style.color = "var(--text-primary)";
    } else {
      resumeLabel.textContent = "Upload text-based PDF (max 5 MB)";
      resumeLabel.style.color = "var(--text-secondary)";
    }
  });

  startBtn.addEventListener("click", startSession);

  // Chat input
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  sendBtn.addEventListener("click", () => sendMessage());

  topDeleteResumeBtn.addEventListener("click", deleteCurrentResume);
  topDeleteChatBtn.addEventListener("click", deleteCurrentChat);

  // Helpers
  function showView(view) {
    viewAuth.style.display = view === "auth" ? "flex" : "none";
    viewSetup.style.display = view === "setup" ? "flex" : "none";
    viewChat.style.display = view === "chat" ? "flex" : "none";

    sidebar.style.display = view === "auth" ? "none" : "flex";
    sidebarToggleBtn.style.display = view === "auth" ? "none" : "block";

    if (view === "auth") topTitle.textContent = "PrepCoach";
    else if (view === "setup") {
      topTitle.textContent = "New Practice Session";
      topActions.style.display = "none";
    }
  }

  function authHeaders(extra) {
    return Object.assign({ Authorization: `Bearer ${token}` }, extra || {});
  }

  async function authFetch(url, opts = {}) {
    opts.headers = authHeaders(opts.headers);
    const res = await fetch(url, opts);
    if (res.status === 401) {
      forceLogin("Your session expired. Please log in again.");
      throw new AuthError("unauthorized");
    }
    return res;
  }

  async function readError(res, fallback) {
    try {
      const body = await res.json();
      if (typeof body.detail === "string") return body.detail;
      if (Array.isArray(body.detail) && body.detail[0]?.msg) return body.detail[0].msg;
    } catch (_) {}
    return fallback;
  }

  function setAuthMode(mode) {
    authMode = mode;
    const isReg = authMode === "register";
    tabLogin.classList.toggle("active", !isReg);
    tabRegister.classList.toggle("active", isReg);
    authSubmit.textContent = isReg ? "Create account" : "Log in";
    authHeading.textContent = isReg ? "Create your account" : "Welcome back";
    authError.style.display = "none";
  }

  async function submitAuth() {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) {
      showError(authError, "Please enter your email and password.");
      return;
    }

    authSubmit.disabled = true;
    authSubmit.textContent = authMode === "register" ? "Creating account..." : "Logging in...";
    authError.style.display = "none";

    try {
      let res;
      if (authMode === "register") {
        res = await fetch(`${API_BASE}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
      } else {
        res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ username: email, password }),
        });
      }

      if (!res.ok) throw new Error(await readError(res, "Couldn't sign you in."));

      const data = await res.json();
      token = data.access_token;
      localStorage.setItem(TOKEN_KEY, token);
      userEmail = email.toLowerCase();
      authPassword.value = "";
      enterApp();
    } catch (err) {
      showError(authError, err.message);
    } finally {
      authSubmit.disabled = false;
      authSubmit.textContent = authMode === "register" ? "Create account" : "Log in";
    }
  }

  function showError(el, msg) {
    el.textContent = msg;
    el.style.display = "block";
  }

  function enterApp() {
    userAvatar.textContent = userEmail ? userEmail[0].toUpperCase() : "U";
    userEmailLabel.textContent = userEmail || "Account";
    loadSidebarSessions();
    showView("setup");
  }

  function forceLogin(msg) {
    token = null;
    userEmail = null;
    localStorage.removeItem(TOKEN_KEY);
    clearChatUI();
    showView("auth");
    if (msg) showError(authError, msg);
  }

  function logout() { forceLogin(); }

  // Load and render ChatGPT Sidebar Recents
  async function loadSidebarSessions() {
    try {
      const res = await authFetch(`${API_BASE}/sessions`);
      if (!res.ok) return;
      sessionsCache = await res.json();
      renderSidebarRecents();
    } catch (_) {}
  }

  function renderSidebarRecents() {
    sidebarRecents.innerHTML = "";
    if (sessionsCache.length === 0) {
      sidebarRecents.innerHTML = `<div style="padding:12px; font-size:12px; color:var(--text-muted);">No past sessions</div>`;
      return;
    }

    sessionsCache.forEach((s) => {
      const a = document.createElement("a");
      a.className = "recent-item" + (s.id === threadId ? " active" : "");
      a.href = "#";
      a.innerHTML = `<span class="recent-item-title">${escapeHtml(s.title)}</span>`;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        sidebar.classList.remove("open");
        openSessionById(s.id, s.title);
      });
      sidebarRecents.appendChild(a);
    });
  }

  async function openSessionById(sessionId, title) {
    clearChatUI();
    threadId = sessionId;
    topTitle.textContent = title;
    topActions.style.display = "flex";
    renderSidebarRecents();
    showView("chat");

    try {
      const [msgRes, statusRes] = await Promise.all([
        authFetch(`${API_BASE}/sessions/${encodeURIComponent(sessionId)}/messages`),
        authFetch(`${API_BASE}/sessions/${encodeURIComponent(sessionId)}/status`)
      ]);

      const msgs = await msgRes.json();
      const status = await statusRes.json();

      messagesContainer.innerHTML = "";
      if (msgs.length === 0) {
        addMessage("ai", "Session reopened! Ask for a DSA question, behavioral prompt, or resume check.");
        renderChips();
      } else {
        msgs.forEach((m) => addMessage(m.role === "user" ? "user" : "ai", m.content, { agent: m.agent }));
      }

      if (!status.can_continue) {
        topDeleteResumeBtn.style.display = "none";
        addMessage("ai", "Note: Resume data for this session has been removed. Conversation is in read-only mode.", { isSystem: true });
        inputEl.disabled = true;
        sendBtn.disabled = true;
      } else {
        topDeleteResumeBtn.style.display = "inline-block";
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
      scrollToBottom();
    } catch (err) {
      alert("Couldn't open session: " + err.message);
    }
  }

  async function startSession() {
    const company = companyInput.value.trim();
    const role = roleInput.value.trim();
    const file = resumeInput.files[0];

    if (!company || !role || !file) {
      showError(setupError, "Please enter company, role, and upload your resume.");
      return;
    }
    if (!file.name.toLowerCase().endsWith(".pdf")) {
      showError(setupError, "Resume must be a PDF file.");
      return;
    }
    if (file.size > MAX_RESUME_BYTES) {
      showError(setupError, "Resume too large (max 5 MB).");
      return;
    }

    startBtn.disabled = true;
    startBtn.textContent = "Starting...";
    setupError.style.display = "none";

    try {
      const form = new FormData();
      form.append("company_name", company);
      form.append("role", role);
      form.append("resume", file);

      const res = await authFetch(`${API_BASE}/session`, { method: "POST", body: form });
      if (!res.ok) throw new Error(await readError(res, "Couldn't start session."));

      const data = await res.json();
      threadId = data.thread_id;
      const title = `${role} @ ${company}`;

      clearChatUI();
      topTitle.textContent = title;
      topActions.style.display = "flex";
      topDeleteResumeBtn.style.display = "inline-block";
      showView("chat");

      addMessage("ai", "I'm your interview coach. Ask me for a calibrated DSA question, a behavioral prompt, company interview intel, or resume feedback.");
      renderChips();

      // Refresh recents
      await loadSidebarSessions();
      inputEl.focus();
    } catch (err) {
      if (err instanceof AuthError) return;
      showError(setupError, err.message);
    } finally {
      startBtn.disabled = false;
      startBtn.textContent = "Start session";
    }
  }

  function clearChatUI() {
    threadId = null;
    busy = false;
    messagesContainer.innerHTML = "";
    chipsContainer.innerHTML = "";
    inputEl.value = "";
    inputEl.style.height = "auto";
    inputEl.disabled = false;
    sendBtn.disabled = false;
    companyInput.value = "";
    roleInput.value = "";
    resumeInput.value = "";
    resumeLabel.textContent = "Upload text-based PDF (max 5 MB)";
    resumeLabel.style.color = "var(--text-secondary)";
    topActions.style.display = "none";
  }

  async function deleteCurrentResume() {
    if (!threadId) return;
    if (!confirm("Delete resume data for this session? Chat messages will remain, but you won't be able to generate new responses.")) return;

    try {
      const res = await authFetch(`${API_BASE}/session/${encodeURIComponent(threadId)}`, { method: "DELETE" });
      if (!res.ok) throw new Error(await readError(res, "Couldn't delete resume."));
      topDeleteResumeBtn.style.display = "none";
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addMessage("ai", "Resume data deleted. This chat is now read-only.", { isSystem: true });
    } catch (err) {
      alert(err.message);
    }
  }

  async function deleteCurrentChat() {
    if (!threadId) return;
    if (!confirm("Permanently delete this entire chat session?")) return;

    try {
      const res = await authFetch(`${API_BASE}/sessions/${encodeURIComponent(threadId)}`, { method: "DELETE" });
      if (!res.ok) throw new Error(await readError(res, "Couldn't delete chat."));
      clearChatUI();
      await loadSidebarSessions();
      showView("setup");
    } catch (err) {
      alert(err.message);
    }
  }

  function renderChips() {
    chipsContainer.innerHTML = "";
    SUGGESTIONS.forEach((text) => {
      const chip = document.createElement("button");
      chip.className = "prompt-chip";
      chip.textContent = text;
      chip.addEventListener("click", () => sendMessage(text));
      chipsContainer.appendChild(chip);
    });
  }

  async function sendMessage(overrideText, isRetry = false) {
    if (busy || !threadId) return;
    const text = (overrideText ?? inputEl.value).trim();
    if (!text) return;

    const requestThreadId = threadId;
    busy = true;
    lastUserText = text;
    chipsContainer.innerHTML = "";
    if (!isRetry) addMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    const typingRow = addTypingIndicator();

    try {
      const res = await authFetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: requestThreadId, user_input: text }),
      });

      typingRow.remove();
      if (threadId !== requestThreadId) return;

      if (!res.ok) {
        const detail = await readError(res, `Request failed (${res.status}).`);
        addMessage("ai", detail, { isError: true });
        return;
      }

      const data = await res.json();
      addMessage("ai", data.final_result, { agent: data.classifier });
    } catch (err) {
      typingRow.remove();
      if (err instanceof AuthError || threadId !== requestThreadId) return;
      addMessage("ai", "Couldn't reach server. Please check your connection.", { isError: true });
    } finally {
      if (threadId === requestThreadId) {
        busy = false;
        sendBtn.disabled = false;
      }
    }
  }

  function scrollToBottom() {
    chatScroller.scrollTop = chatScroller.scrollHeight;
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "message-row ai";
    row.innerHTML = `
      <div class="msg-avatar">AI</div>
      <div class="msg-body">
        <div class="typing-wave"><span></span><span></span><span></span></div>
      </div>
    `;
    messagesContainer.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addMessage(role, text, opts = {}) {
    const row = document.createElement("div");
    row.className = `message-row ${role}`;

    let avatarHtml = "";
    if (role === "ai") {
      avatarHtml = `<div class="msg-avatar">AI</div>`;
    }

    let tagHtml = "";
    if (role === "ai" && opts.agent && AGENT_LABELS[opts.agent]) {
      tagHtml = `<div class="msg-tag">${AGENT_LABELS[opts.agent]}</div>`;
    }

    let actionsHtml = "";
    if (role === "ai" && !opts.isError && !opts.isSystem) {
      actionsHtml = `
        <div class="msg-actions">
          <button class="msg-action-btn copy-btn">Copy</button>
        </div>
      `;
    }

    row.innerHTML = `
      ${avatarHtml}
      <div class="msg-body">
        ${tagHtml}
        <div class="msg-bubble ${opts.isError ? "error" : ""}">${role === "ai" ? renderMarkdownLite(text) : escapeHtml(text)}</div>
        ${actionsHtml}
      </div>
    `;

    const copyBtn = row.querySelector(".copy-btn");
    if (copyBtn) {
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied ✓";
        } catch (_) {
          copyBtn.textContent = "Failed";
        }
        setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
      });
    }

    messagesContainer.appendChild(row);
    scrollToBottom();
    return row;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMarkdownLite(raw) {
    const escaped = escapeHtml(String(raw ?? ""));
    const lines = escaped.split("\n");
    let html = "";
    let inList = false;
    let inCode = false;
    let code = [];

    for (const l of lines) {
      const trimmed = l.trim();
      if (trimmed.startsWith("```")) {
        if (inList) { html += "</ul>"; inList = false; }
        if (!inCode) { inCode = true; code = []; }
        else {
          html += `<pre><code>${code.join("\n")}</code></pre>`;
          inCode = false;
          code = [];
        }
        continue;
      }
      if (inCode) {
        code.push(l);
        continue;
      }
      if (trimmed.startsWith("- ") || trimmed.startsWith("* ")) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${inlineFormat(trimmed.slice(2))}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (/^#{1,3}\s+/.test(trimmed)) {
          html += `<p><strong>${inlineFormat(trimmed.replace(/^#{1,3}\s+/, ""))}</strong></p>`;
        } else if (trimmed.length > 0) {
          html += `<p>${inlineFormat(trimmed)}</p>`;
        }
      }
    }
    if (inCode) html += `<pre><code>${code.join("\n")}</code></pre>`;
    if (inList) html += "</ul>";
    return html || `<p>${inlineFormat(escaped)}</p>`;
  }

  function inlineFormat(text) {
    return text
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  // App init
  (async function init() {
    showView("auth");
    const saved = localStorage.getItem(TOKEN_KEY);
    if (!saved) return;
    token = saved;
    try {
      const res = await fetch(`${API_BASE}/auth/me`, { headers: authHeaders() });
      if (res.ok) {
        const me = await res.json();
        userEmail = me.email;
        enterApp();
      } else {
        forceLogin();
      }
    } catch (_) {
      showView("auth");
      token = null;
    }
  })();
</script>

</body>
</html>
