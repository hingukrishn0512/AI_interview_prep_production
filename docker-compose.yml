
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach_pw
      POSTGRES_DB: coach
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - .:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
